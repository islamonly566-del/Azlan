
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial}
header{position:fixed;top:0;left:0;right:0;z-index:5;
text-align:center;padding:16px;background:#000a;font-size:20px}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}
.video{height:100dvh;position:relative;scroll-snap-align:start;
display:flex;align-items:center;justify-content:center;background:#171717}
video{width:100%;height:100%;object-fit:contain}
.info{position:absolute;bottom:30px;left:12px;right:12px;
pointer-events:none;text-shadow:0 1px 5px #000}
.panel{padding:20px;background:#171717}
input,button{padding:12px;margin:5px 0;max-width:100%}
button{background:#ff2458;color:white;border:0;border-radius:7px}
input[type=text],input[type=password]{width:100%}
#status{white-space:pre-wrap}
</style>
</head>
<body>
<header>MY VIDEO</header>

<main id="feed" class="feed"></main>

<section class="panel">
<h2>اپنی ویڈیو اپ لوڈ کریں</h2>
<form id="upload">
<input name="title" type="text" maxlength="100"
placeholder="ویڈیو کا نام" required>
<input name="video" type="file" accept="video/mp4" required>
<button type="submit">ویڈیو بھیجیں</button>
</form>
<p>ویڈیو آپ کی منظوری تک عوامی فیڈ میں نہیں آئے گی۔</p>
<p id="status"></p>
</section>

<section class="panel">
<h2>ایڈمن کنٹرول</h2>
<p>صرف اپنے ایڈمن پاس ورڈ سے داخل ہوں۔</p>
<button id="login">ایڈمن لاگ اِن</button>
<button id="pending">منظوری کے منتظر ویڈیوز</button>
<div id="admin"></div>
</section>

<script>
const feed=document.getElementById("feed");
const status=document.getElementById("status");
const admin=document.getElementById("admin");
let adminPassword="";

async function loadVideos(){
  const r=await fetch("/api/videos");
  if(!r.ok) throw Error("ویڈیوز لوڈ نہیں ہو سکیں");
  const videos=await r.json();
  feed.replaceChildren();

  if(!videos.length){
    const p=document.createElement("p");
    p.textContent="ابھی کوئی منظور شدہ ویڈیو نہیں۔";
    p.style.padding="90px 20px";
    feed.append(p);
    return;
  }

  videos.forEach(item=>{
    const section=document.createElement("section");
    section.className="video";
    const v=document.createElement("video");
    v.src=item.url;
    v.controls=true;
    v.playsInline=true;
    v.loop=true;
    v.preload="metadata";

    const info=document.createElement("div");
    info.className="info";
    const h=document.createElement("h3");
    h.textContent=item.title;
    info.append(h);
    section.append(v,info);
    feed.append(section);
  });

  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      const v=e.target;
      if(e.isIntersecting){
        feed.querySelectorAll("video").forEach(other=>{
          if(other!==v) other.pause();
        });
        v.play().catch(()=>{});
      }else{
        v.pause();
      }
    });
  },{threshold:0.7});

  feed.querySelectorAll("video").forEach(v=>observer.observe(v));
}

document.getElementById("upload").addEventListener("submit",async e=>{
  e.preventDefault();
  status.textContent="ویڈیو بھیجی جا رہی ہے...";
  try{
    const data=new FormData(e.target);
    const r=await fetch("/api/upload",{method:"POST",body:data});
    const out=await r.json();
    if(!r.ok) throw Error(out.error||"اپ لوڈ ناکام");
    status.textContent="ویڈیو جمع ہوگئی۔ ایڈمن کی منظوری کا انتظار کریں۔";
    e.target.reset();
  }catch(err){status.textContent="خرابی: "+err.message;}
});

document.getElementById("login").onclick=()=>{
  const p=prompt("اپنا ایڈمن پاس ورڈ درج کریں:");
  if(p===null)return;
  adminPassword=p;
  admin.textContent="پاس ورڈ درج ہوگیا۔ اب منتظر ویڈیوز دیکھیں۔";
};

document.getElementById("pending").onclick=async()=>{
  if(!adminPassword){
    alert("پہلے ایڈمن لاگ اِن کریں۔");
    return;
  }
  admin.textContent="لوڈ ہو رہا ہے...";
  try{
    const r=await fetch("/api/admin/pending",{
      headers:{"x-admin-password":adminPassword}
    });
    const data=await r.json();
    if(!r.ok) throw Error(data.error||"لاگ اِن ناکام");

    admin.replaceChildren();
    if(!data.length){
      admin.textContent="کوئی منتظر ویڈیو نہیں۔";
      return;
    }

    data.forEach(item=>{
      const box=document.createElement("div");
      box.style.padding="12px";
      const title=document.createElement("p");
      title.textContent=item.title;

      const approve=document.createElement("button");
      approve.textContent="منظور کریں";
      approve.onclick=()=>adminAction(item.id,"approve");
      const del=document.createElement("button");
      del.textContent="مسترد / حذف کریں";
      del.onclick=()=>adminAction(item.id,"delete");
      box.append(title,approve,del);
      admin.append(box);
    });
  }catch(err){admin.textContent="خرابی: "+err.message;}
};

async function adminAction(id,action){
  try{
    const r=await fetch("/api/admin/"+encodeURIComponent(id)+
      (action==="approve"?"/approve":""),{
      method:action==="approve"?"POST":"DELETE",
      headers:{"x-admin-password":adminPassword}
    });
    const data=await r.json();
    if(!r.ok) throw Error(data.error||"عمل ناکام");
    alert(data.message);
    document.getElementById("pending").click();
    await loadVideos();
  }catch(err){alert(err.message);}
}

loadVideos().catch(err=>status.textContent=err.message);
</script>
</body>
</html>
